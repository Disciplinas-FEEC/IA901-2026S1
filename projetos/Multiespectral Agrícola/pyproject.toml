[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "multiespectral-agricola"
version = "0.1.0"
description = "Segmentacao semantica de imagens agricolas com fusao RGB, NIR, NDVI e NDWI para deteccao de anomalias"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.3",
    "pillow>=11.0.0",
    "python-dotenv>=1.2.2",
    "pytorch-lightning>=2.6.5",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
    "tensorboard>=2.20.0",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = [ { index = "pytorch-cu118" } ]
torchvision = [ { index = "pytorch-cu118" } ]
torchaudio = [ { index = "pytorch-cu118" } ]
